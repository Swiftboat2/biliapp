services:
  postgres:
    image: postgres:16-alpine
    container_name: biliapp-postgres
    restart: always
    environment:
      POSTGRES_USER: biliapp_user
      POSTGRES_PASSWORD: biliapp_password
      POSTGRES_DB: biliapp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biliapp_user -d biliapp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: biliapp-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

